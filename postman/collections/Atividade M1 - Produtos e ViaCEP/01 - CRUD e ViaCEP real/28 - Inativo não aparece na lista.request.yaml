$kind: http-request
url: "{{baseUrl}}/product"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test("Produto inativo oculto", function () { pm.expect(pm.response.json().some(p=>p.id === pm.collectionVariables.get('productId'))).to.eql(false); });
    language: text/javascript
order: 28000
