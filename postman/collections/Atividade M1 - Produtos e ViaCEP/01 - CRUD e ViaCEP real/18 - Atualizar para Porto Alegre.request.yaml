$kind: http-request
url: "{{baseUrl}}/product"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Produto de teste M1",
      "price": 12990,
      "category": "atividade-m1",
      "distributionCenter": "Porto Alegre",
      "id": "{{productId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 18000
