$kind: http-request
url: "{{baseUrl}}/product/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test("ID correto", function () { pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('productId')); });
    language: text/javascript
order: 3000
