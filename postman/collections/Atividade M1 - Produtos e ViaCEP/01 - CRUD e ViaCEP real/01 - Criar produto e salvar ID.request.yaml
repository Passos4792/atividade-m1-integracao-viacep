$kind: http-request
url: "{{baseUrl}}/product"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Produto de teste M1",
      "price": 12990,
      "category": "atividade-m1",
      "distributionCenter": "Mogi das Cruzes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      pm.test("Produto criado", function () { const p = pm.response.json(); pm.expect(p.id).to.be.a('string'); pm.expect(p.active).to.eql(true); pm.expect(p.distributionCenter).to.eql('Mogi das Cruzes'); pm.collectionVariables.set('productId', p.id); });
    language: text/javascript
order: 1000
