$kind: http-request
url: "{{baseUrl}}/product"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Produto de teste M1",
      "price": 12990,
      "category": "atividade-m1",
      "distributionCenter": "São Paulo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      pm.test("Status coerente no corpo", function () { pm.expect(pm.response.json().status).to.eql(400); });
    language: text/javascript
order: 22000
