$kind: http-request
url: "{{baseUrl}}/product"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Produto de teste M1",
      "price": 12990,
      "category": "atividade-m1",
      "distributionCenter": "Mogi das Cruzes",
      "id": "inexistente"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', function () { pm.response.to.have.status(404); });
      pm.test("Status coerente no corpo", function () { pm.expect(pm.response.json().status).to.eql(404); });
    language: text/javascript
order: 24000
