$kind: http-request
url: "{{baseUrl}}/product?category=atividade-m1"
method: GET
queryParams:
  category: atividade-m1
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      pm.test("Filtro correto", function () { pm.expect(pm.response.json()).to.have.length.above(0); pm.expect(pm.response.json().every(p => p.category === 'atividade-m1')).to.eql(true); });
    language: text/javascript
order: 4000
